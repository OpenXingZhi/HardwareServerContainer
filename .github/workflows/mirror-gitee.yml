name: Mirror to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Push exact main SHA to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git push "https://oauth2:${GITEE_TOKEN}@gitee.com/star-spider-intelligence/HardwareServerContainer.git" HEAD:refs/heads/main
