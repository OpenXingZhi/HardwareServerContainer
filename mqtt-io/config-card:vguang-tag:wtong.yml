mqtt:
  host: mqtt-broker
  port: 1883
  topic_prefix: mqtt-io

# The server opens the scanner and UHF reader over kRPC.
stream_modules: []

logging:
  version: 1
  handlers:
    console:
      class: logging.StreamHandler
      formatter: default
      level: DEBUG
  formatters:
    default:
      format: "%(asctime)s %(name)s [%(levelname)s] %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
  loggers:
    mqtt_io:
      level: DEBUG
      handlers: [console]
      propagate: True
